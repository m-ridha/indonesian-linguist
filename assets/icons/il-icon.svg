<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="flag-clip">
      <rect x="4" y="8" width="56" height="48" rx="12" ry="12" />
    </clipPath>
  </defs>

  <!-- Drop shadow base plate -->
  <rect x="4" y="10" width="56" height="48" rx="12" ry="12" fill="rgba(0, 0, 0, 0.16)" />

  <!-- Main flag body clipped to rounded corners -->
  <g clip-path="url(#flag-clip)">
    <!-- Top Red Band (Sang Saka Merah) -->
    <rect x="4" y="8" width="56" height="24" fill="#CE1126" />
    <!-- Bottom White Band (Sang Saka Putih) -->
    <rect x="4" y="32" width="56" height="24" fill="#FFFFFF" />
    <!-- Subtle divider line between red and white -->
    <line x1="4" y1="32" x2="60" y2="32" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.75" />
  </g>

  <!-- Outer border stroke ensuring crisp contrast on dark & light backgrounds -->
  <rect x="4" y="8" width="56" height="48" rx="12" ry="12" fill="none" stroke="rgba(0, 0, 0, 0.15)" stroke-width="1.5" />
</svg>
