skill: "indonesian-linguist"
description: "Behavioral evaluation scenario suite for the indonesian-linguist skill."

scenarios:
  - scenario_id: "isolated_ui_polysemy_and_compaction"
    description: "Verifies accurate resolution of isolated UI polysemy traps and segmented pill compaction."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/indonesian-linguist/SKILL.md"
    turns:
      - user_input: "Localize these workout app UI keys into Bahasa Indonesia: 'Back' (button), 'back' (muscle group), 'Clear rating', 'Discard running workout', 'Sets are drawn', 'As entered', 'Same as work sets', '{0} week streak'."
        assertions:
          - type: "required_pattern"
            pattern: "Kembali"
            message: "Must translate capital 'Back' button as 'Kembali'."
          - type: "required_pattern"
            pattern: "(?i)punggung"
            message: "Must translate lowercase anatomical 'back' as 'punggung'."
          - type: "required_pattern"
            pattern: "Hapus penilaian"
            message: "Must translate 'Clear rating' as 'Hapus penilaian'."
          - type: "required_pattern"
            pattern: "Sesuai input"
            message: "Must compact 'As entered' to 'Sesuai input'."
          - type: "required_pattern"
            pattern: "Ikuti set utama"
            message: "Must compact 'Same as work sets' to 'Ikuti set utama'."
          - type: "required_pattern"
            pattern: "\\{0\\} minggu beruntun"
            message: "Must keep quantity placeholder before noun ('{0} minggu beruntun')."
          - type: "forbidden_pattern"
            pattern: "(?i)(peringkat yang jelas|latihan lari|set diundi|\\b(yg|dgn|utk)\\b)"
            message: "Must never emit literal calques or banned SMS abbreviations."

  - scenario_id: "four_way_verb_voice_matrix"
    description: "Verifies distinction between Zero-prefix action buttons and ter- stative badges."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/indonesian-linguist/SKILL.md"
    turns:
      - user_input: "Translate these UI pairs into Bahasa Indonesia: 1) Button: 'Save' vs Toast badge: 'Saved'. 2) Button: 'Share' vs Status badge: 'Reached!'. 3) Metric label: 'Lifted in total'."
        assertions:
          - type: "required_pattern"
            pattern: "Simpan"
            message: "Action button 'Save' must use base imperative 'Simpan'."
          - type: "required_pattern"
            pattern: "Tersimpan"
            message: "Status badge 'Saved' must use stative 'Tersimpan'."
          - type: "required_pattern"
            pattern: "Tercapai"
            message: "Achievement badge 'Reached!' must use 'Tercapai!'."
          - type: "required_pattern"
            pattern: "Total beban terangkat"
            message: "Metric 'Lifted in total' must use 'Total beban terangkat'."

  - scenario_id: "anti_slop_and_eyd_v_prose_editing"
    description: "Verifies removal of Indonesian AI slop, bureaucratic calques, non-standard spellings, and em dashes."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/indonesian-linguist/SKILL.md"
    turns:
      - user_input: "Perbaiki paragraf ini agar alami dan sesuai EYD V: 'Di era digital yang serba cepat ini, ditengah hiruk pikuk kesibukan—aplikasi ini bukan hanya mencatat olahraga, tetapi juga adalah merupakan solusi handal dikarenakan fitur yg canggih dalam rangka untuk merubah resiko cedera. Silahkan di deploy sekarang.'"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)silakan"
            message: "Must correct 'Silahkan' to 'Silakan'."
          - type: "required_pattern"
            pattern: "(?i)risiko"
            message: "Must correct 'resiko' to 'risiko'."
          - type: "required_pattern"
            pattern: "(?i)di-deploy"
            message: "Must hyphenate Indonesian passive prefix attached to foreign root ('di-deploy')."
          - type: "forbidden_pattern"
            pattern: "(?i)(hiruk[- ]pikuk|di era digital|adalah merupakan|dikarenakan|dalam rangka untuk|silahkan|resiko|merubah|handal|—)"
            message: "Must strip all AI slop phrases, double copulas, non-standard spellings, and em dashes."
